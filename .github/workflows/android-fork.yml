# fork 自用的 Android 构建：只出 arm64 APK，不发 release。
# CI 里用一次性密钥签名，产物下载到手机后再用 fork 的固定密钥重签，
# 所以仓库里不需要签名相关的 secrets。
name: Android (fork)

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
      - 'upstream-sync/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: 'master'
          cache: true

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle

      - name: Throwaway signing key
        run: |
          pass=$(openssl rand -hex 16)
          keytool -genkeypair -keystore android/app/upload-keystore.jks -storetype JKS \
            -alias ci -keyalg RSA -keysize 2048 -validity 1 \
            -storepass "$pass" -keypass "$pass" -dname "CN=ci"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=ci\nstoreFile=upload-keystore.jks\n' "$pass" "$pass" > android/key.properties

      - name: Test
        run: |
          flutter pub get
          flutter test

      - name: Build APK
        run: |
          flutter build apk -t lib/src/main.dart --release --split-per-abi --target-platform android-arm64
          version=$(grep -m1 '^version:' pubspec.yaml | cut -d' ' -f2)
          mv build/app/outputs/apk/release/app-arm64-v8a-release.apk "JHenTai-${version}-${GITHUB_SHA::7}-arm64-v8a-ci-signed.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: android-arm64
          path: JHenTai-*-ci-signed.apk
          retention-days: 14
