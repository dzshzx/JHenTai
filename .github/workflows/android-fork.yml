# fork 自用的 Android 构建：只出 arm64 APK，不发 release。
# 签名密钥来自仓库 secrets ENCODED_KEYSTORE、KEY_PROPERTIES，
# 原件和密码存在用户 Bitwarden 的「JHenTai 签名密钥」条目里。
name: Android (fork)

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
      - 'upstream-sync/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: 'master'
          cache: true

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle

      - name: Signing key
        env:
          ENCODED_KEYSTORE: ${{ secrets.ENCODED_KEYSTORE }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
        run: |
          if [ -z "$ENCODED_KEYSTORE" ] || [ -z "$KEY_PROPERTIES" ]; then
            echo "::error::缺少签名 secrets ENCODED_KEYSTORE / KEY_PROPERTIES"
            exit 1
          fi
          echo "$ENCODED_KEYSTORE" | base64 -d > android/app/upload-keystore.jks
          echo "$KEY_PROPERTIES" > android/key.properties

      - name: Test
        run: |
          flutter pub get
          flutter test

      - name: Build APK
        run: |
          flutter build apk -t lib/src/main.dart --release --split-per-abi --target-platform android-arm64
          version=$(grep -m1 '^version:' pubspec.yaml | cut -d' ' -f2)
          mv build/app/outputs/apk/release/app-arm64-v8a-release.apk "JHenTai-${version}-${GITHUB_SHA::7}-arm64-v8a.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: android-arm64
          path: JHenTai-*-arm64-v8a.apk
          retention-days: 14
